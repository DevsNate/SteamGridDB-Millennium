[plugin]
id = "steamgriddb"
name = "SteamGridDB"
version = "1.1"
author = "DevsNate"
description = "Browse and apply SteamGridDB artwork, or restyle your whole library with a SteamGridDB collection, in Big Picture and on the Steam desktop."

[assets]
resources = ["assets/*"]

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[compiler]
output_path = "dist/steamgriddb.star"
